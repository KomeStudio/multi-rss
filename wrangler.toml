name = "multi-rss"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# KV cache dữ liệu RSS. Tên binding phải là định danh JS hợp lệ (không có dấu gạch ngang)
[[kv_namespaces]]
binding = "RSS_KV"
id = "028581bfdb9f4735a0cd3972dd0a76d5"

[vars]
FEEDS = "https://komestudio.com/rss.xml,https://blog.komestudio.com/rss.xml,https://vntim.blogspot.com/rss.xml"
MAX_SIZE = 50
TITLE = "Kome Studio RSS"
DESCRIPTION = "Kome Studio creates cozy games 😊 lovable characters, animated stories, and original worlds 🎮 Play, smile, belong 🚀 Discover the KomeVerse."
AUTHOR = "Hoang Dac Viet"
SITE_URL = "https://multi-rss.kometop.workers.dev"
CUSTOM_URL = "http://rss.kome.top"
CACHE_MAX_AGE = "86400"

[triggers]
crons = ["0 */2 * * *"]
